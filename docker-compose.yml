services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      TZ: Europe/Amsterdam
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: appelkaas_db
      MYSQL_USER: appelkaas_user
      MYSQL_PASSWORD: appelkaas_password
      TZ: Europe/Amsterdam
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
  
  phpmyadmin:
    # image: phpmyadmin/phpmyadmin
    image: arm64v8/phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: appelkaas_user
      PMA_PASSWORD: appelkaas_password
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  db_data: